<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Your Proposal — IPTalons, Inc.</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { min-height: 100%; }
    body { font-family: 'DM Sans', sans-serif; background: #EFF2E8; color: #1F2A1B; -webkit-font-smoothing: antialiased; }
    .col-span-2 { grid-column: span 2; }
    .w-full { width: 100%; }
    @media print {
      body { background: white; }
      .share-topbar { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // The Worker replaces the quoted placeholder with the share JSON at /p/<token>.
    // Direct asset access leaves the string, which renders the "link inactive" fallback.
    window.__SHARE__ = "__SHARE_DATA__";
  </script>

  <script type="text/babel" src="/p/_assets/ip-components.jsx"></script>
  <script type="text/babel" src="/p/_assets/ip-screens.jsx"></script>
  <script type="text/babel">
    const share = window.__SHARE__;
    const SharePage = () => {
      if (!share || !share.proposal) {
        return (
          <div style={{ display: 'grid', placeItems: 'center', height: '100vh', textAlign: 'center' }}>
            <div>
              <div style={{ fontSize: 40 }}>🍃</div>
              <h1 style={{ fontSize: 20, margin: '12px 0 6px' }}>This proposal link is no longer active</h1>
              <p style={{ color: '#5F6557', fontSize: 14 }}>Please contact IPTalons, Inc. at (972) 422-9169 for a fresh copy.</p>
            </div>
          </div>
        );
      }
      return <ProposalPreview proposal={share.proposal} shareMode />;
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<SharePage />);
  </script>
</body>
</html>
