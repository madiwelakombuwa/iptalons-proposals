<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Your Proposal — IPTalons, Inc.</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { min-height: 100%; }
    body { font-family: 'DM Sans', sans-serif; background: #EFF2E8; color: #1F2A1B; -webkit-font-smoothing: antialiased; }
    nav { max-width: 720px; margin: 18px auto; padding: 12px 16px; border-radius: 9px; color: #fff; background: #2D4422; display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    nav button { border: 0; border-radius: 7px; padding: 8px 12px; background: #fff; color: #2D4422; font-weight: 700; cursor: pointer; }
    .page { position: relative; width: 720px; min-height: 932px; margin: 0 auto 18px; overflow: hidden; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.1); break-after: page; }
    .rail { position: absolute; inset: 0 auto 0 0; width: 32px; background: linear-gradient(#6B8E3D,#4A7C2E); }
    .content { padding: 48px 56px 76px 64px; }
    .logo { width: 170px; height: auto; }
    .hero { height: 350px; margin: 34px 0; border-radius: 6px; background: linear-gradient(135deg,#2D4422,#171c17,#365329); color: #fff; display: grid; place-content: center; gap: 18px; text-align: center; text-transform: uppercase; letter-spacing: 4px; }
    .hero b:nth-child(2) { font-size: 36px; color: #b8d89a; } .hero b { font-size: 27px; }
    .company { text-align: right; color: #4A7C2E; font-size: 12px; line-height: 1.7; margin-bottom: 45px; }
    .recipient, p { font-size: 13px; line-height: 1.75; } .date { margin-top: 22px; font-size: 12px; font-weight: 800; text-transform: uppercase; }
    h1 { margin-bottom: 24px; font-size: 28px; } h2 { margin: 26px 0 10px; font-size: 18px; } p { margin-bottom: 14px; }
    .eyebrow { color: #4A7C2E; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; font-weight: 800; margin-bottom: 18px; }
    .signature { margin-top: 48px; font-family: Georgia,serif; font-size: 28px; color: #2D4422; } .signature span { display: block; width: 220px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #9da89a; font: 12px/1.5 'DM Sans',sans-serif; color: #1F2A1B; }
    .service-list article { margin: 14px 0; padding: 16px; border: 1px solid #e1e7da; border-radius: 8px; background: #f8faf5; } .service-list h2 { margin: 0 0 4px; }
    .callout { margin-top: 20px; padding: 18px; border-radius: 8px; background: #e8f2da; color: #2D4422; font-weight: 800; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; } th,td { padding: 13px 10px; border-bottom: 1px solid #dfe5d8; text-align: right; } th:first-child,td:first-child { text-align: left; } td small { display: block; color: #6B7766; }
    .total { display: flex; justify-content: space-between; margin: 28px 0 42px; padding: 18px; background: #2D4422; color: #fff; text-transform: uppercase; font-size: 13px; } .total strong { font-size: 20px; }
    .valid { margin-top: 40px; color: #6B7766; } .sign-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 100px; font-size: 12px; line-height: 1.6; } .sign-line { border-top: 1px solid #6B7766; margin-bottom: 10px; }
    footer { position: absolute; left: 64px; right: 56px; bottom: 22px; display: flex; align-items: center; justify-content: space-between; color: #899083; font-size: 10px; letter-spacing: 1px; } footer img { width: 32px; }
    .inactive { min-height: 100vh; display: grid; place-items: center; text-align: center; } .leaf { font-size: 40px; }
    @media (max-width: 760px) { nav,.page { width: calc(100% - 20px); } .page { min-height: auto; } .content { padding: 34px 28px 70px 48px; } .hero { height: 260px; } }
    @media print {
      body { background: white; }
      nav { display: none !important; } .page { box-shadow: none; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script nonce="__CSP_NONCE__">
    // The Worker replaces the quoted placeholder with the share JSON at /p/<token>.
    // Direct asset access leaves the string, which renders the "link inactive" fallback.
    window.__SHARE__ = "__SHARE_DATA__";
  </script>

  <script defer nonce="__CSP_NONCE__" src="/p/_assets/share.js"></script>
</body>
</html>
